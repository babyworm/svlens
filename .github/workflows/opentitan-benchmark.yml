name: opentitan-benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git python3 python3-yaml ccache \
            catch2 libyaml-cpp-dev

      - name: Cache slang install
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: ${{ runner.os }}-svlens-slang-${{ hashFiles('scripts/setup-deps.sh') }}

      - name: Stage slang dependency
        run: ./scripts/setup-deps.sh --prefix "$HOME/.local"

      - name: Build svlens
        run: make build CMAKE_PREFIX_PATH="$HOME/.local"

      - name: Test benchmark parsing and stale-report guards
        run: python3 -B -m unittest discover -s bench/opentitan -p 'test_*.py'

      - name: Run OpenTitan benchmark
        run: make bench CMAKE_PREFIX_PATH="$HOME/.local"

      - name: Elaborate AES and SoC assertions with pinned RTL
        run: |
          cd bench/opentitan
          "$HOME/.local/bin/slang" --single-unit -F filelists/aes.f \
            --top aes --top svlens_cdc_assertions \
            results/aes/cdc_sva/cdc_assertions.sva
          "$HOME/.local/bin/slang" --single-unit -F filelists/top_earlgrey.f \
            --top top_earlgrey --top svlens_cdc_assertions \
            results/top_earlgrey/cdc_sva/cdc_assertions.sva

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: opentitan-benchmark
          path: bench/opentitan/results/
          if-no-files-found: warn
