name: python

on:
  push:
  pull_request:

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: svlens-python-wheel
          path: dist/*.whl
