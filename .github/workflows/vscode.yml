name: vscode

on:
  push:
  pull_request:

jobs:
  extension-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check extension scripts
        run: |
          node --check vscode/extension.js
          node --check vscode/report.js
          node --test vscode/test/report.test.js vscode/test/extension.test.js
