# Top EarlGrey — full SoC clock structure
clock_domains:
  - name: clk_main_i
    type: primary
    freq_mhz: 100
  - name: clk_io_i
    type: primary
    freq_mhz: 96
    async_to: [clk_main_i, clk_usb_i, clk_aon_i]
  - name: clk_usb_i
    type: primary
    freq_mhz: 48
    async_to: [clk_main_i, clk_io_i, clk_aon_i]
  - name: clk_aon_i
    type: primary
    freq_mhz: 0.2
    async_to: [clk_main_i, clk_io_i, clk_usb_i]
  - name: clk_io_div2_i
    type: generated
    master: clk_io_i
    divide_by: 2
  - name: clk_io_div4_i
    type: generated
    master: clk_io_i
    divide_by: 4

domain_pair_probes:
  - from_domain: clk_main_i
    to_domain: clk_io_i
    description: "Potential Main-to-IO domain pair"
  - from_domain: clk_io_i
    to_domain: clk_main_i
    description: "Potential IO-to-Main domain pair"
  - from_domain: clk_main_i
    to_domain: clk_usb_i
    description: "Potential Main-to-USB domain pair; signal path unverified"
  - from_domain: clk_usb_i
    to_domain: clk_main_i
    description: "Potential USB-to-Main domain pair; signal path unverified"
  - from_domain: clk_aon_i
    to_domain: clk_main_i
    description: "Potential AON-to-Main domain pair; signal path unverified"
  - from_domain: clk_main_i
    to_domain: clk_aon_i
    description: "Potential Main-to-AON domain pair; signal path unverified"

# FIFO references verify prim_fifo_async.sv pointer FFs and sync_wptr/sync_rptr
# wiring; the power-manager reference checks a bundled-data path, not protocol
# correctness. Root labels use top_earlgrey.sv clock-port connections.
reference_crossings:
  - source: top_earlgrey.u_xbar_main.u_asf_29.reqfifo.fifo_wptr_gray_q
    dest: top_earlgrey.u_xbar_main.u_asf_29.reqfifo.sync_wptr.u_sync_1.q_o
    source_root_domain: clk_main_i
    dest_root_domain: clk_io_i
    evidence: xbar_main.sv:811, tlul_fifo_async.sv:28, prim_fifo_async.sv:65-79
  - source: top_earlgrey.u_xbar_main.u_asf_29.rspfifo.fifo_wptr_gray_q
    dest: top_earlgrey.u_xbar_main.u_asf_29.rspfifo.sync_wptr.u_sync_1.q_o
    source_root_domain: clk_io_i
    dest_root_domain: clk_main_i
    evidence: xbar_main.sv:811, tlul_fifo_async.sv:61, prim_fifo_async.sv:65-79
  - source: top_earlgrey.u_usbdev.usbdev_avfifo.fifo_wptr_gray_q
    dest: top_earlgrey.u_usbdev.usbdev_avfifo.sync_wptr.u_sync_1.q_o
    source_root_domain: clk_io_i
    dest_root_domain: clk_usb_i
    evidence: usbdev.sv:195-213, prim_fifo_async.sv:65-79
  - source: top_earlgrey.u_usbdev.usbdev_avfifo.fifo_rptr_gray_q
    dest: top_earlgrey.u_usbdev.usbdev_avfifo.sync_rptr.u_sync_1.q_o
    source_root_domain: clk_usb_i
    dest_root_domain: clk_io_i
    evidence: usbdev.sv:195-213, prim_fifo_async.sv:90-112
  - source: top_earlgrey.u_pwrmgr_aon.i_slow_fsm.cause_q
    dest: top_earlgrey.u_pwrmgr_aon.i_cdc.pwrup_cause_o
    source_root_domain: clk_aon_i
    dest_root_domain: clk_io_i
    category: VIOLATION
    evidence: pwrmgr_slow_fsm.sv:69-85,224; pwrmgr.sv:189,217,295; pwrmgr_cdc.sv:201-230; top_earlgrey.sv:1747-1751
    description: "Bundled-data path gated by a synchronized cause toggle; path and roots checked, stability not proven"
  - source: top_earlgrey.u_lc_ctrl.transition_token_q
    dest: top_earlgrey.u_flash_ctrl.u_lfsr.lfsr_q
    source_root_domain: clk_io_i
    dest_root_domain: clk_main_i
    evidence: lc_ctrl.sv:397; top_earlgrey.sv:1666,2084; flash_ctrl.sv:272-276
    description: "RMA seed path through lc_flash_rma_seed_o/rma_seed_i; exact FF path and roots checked, capture safety not proven"

sva_references:
  - source: top_earlgrey.u_usbdev.usbdev_avfifo.fifo_wptr_gray_q
    dest: top_earlgrey.u_usbdev.usbdev_avfifo.sync_wptr.u_sync_1.q_o
    assertion_suffix: _2ff
    contains:
      - "$past(top_earlgrey.u_usbdev.usbdev_avfifo.sync_wptr.u_sync_1.q_o)"
      - "@(posedge top_earlgrey.u_usbdev.usbdev_avfifo.sync_wptr.u_sync_1.clk_i)"
    evidence: usbdev.sv:195-213, prim_fifo_async.sv:65-79
  - source: top_earlgrey.u_usbdev.usbdev_avfifo.fifo_wptr_gray_q
    dest: top_earlgrey.u_usbdev.usbdev_avfifo.sync_wptr.u_sync_1.q_o
    assertion_suffix: _fifo_gray
    contains:
      - "$countones(top_earlgrey.u_usbdev.usbdev_avfifo.fifo_wptr_gray_q ^"
      - "@(posedge top_earlgrey.u_usbdev.usbdev_avfifo.clk_wr_i)"
    evidence: prim_fifo_async.sv:280-284
  - source: top_earlgrey.u_usbdev.usbdev_avfifo.fifo_wptr_gray_q
    dest: top_earlgrey.u_usbdev.usbdev_avfifo.sync_wptr.u_sync_1.q_o
    assertion_suffix: _fifo_no_step
    contains:
      - "!(top_earlgrey.u_usbdev.usbdev_avfifo.wvalid_i && top_earlgrey.u_usbdev.usbdev_avfifo.wready_o) |=> $stable(top_earlgrey.u_usbdev.usbdev_avfifo.fifo_wptr_gray_q)"
      - "@(posedge top_earlgrey.u_usbdev.usbdev_avfifo.clk_wr_i)"
    evidence: prim_fifo_async.sv:52,65-71,170
  - source: top_earlgrey.u_usbdev.usbdev_avfifo.fifo_rptr_gray_q
    dest: top_earlgrey.u_usbdev.usbdev_avfifo.sync_rptr.u_sync_1.q_o
    assertion_suffix: _fifo_no_step
    contains:
      - "!(top_earlgrey.u_usbdev.usbdev_avfifo.rvalid_o && top_earlgrey.u_usbdev.usbdev_avfifo.rready_i) |=> $stable(top_earlgrey.u_usbdev.usbdev_avfifo.fifo_rptr_gray_q)"
      - "@(posedge top_earlgrey.u_usbdev.usbdev_avfifo.clk_rd_i)"
    evidence: prim_fifo_async.sv:85,98-104,171
  - source: top_earlgrey.u_spi_host0.u_cmd_cdc.u_sync_reqack.u_prim_sync_reqack.src_req_q
    dest: top_earlgrey.u_spi_host0.u_cmd_cdc.u_sync_reqack.u_prim_sync_reqack.req_sync.u_sync_1.q_o
    assertion_suffix: _ack_requires_req
    contains:
      - "dst_ack_i |-> top_earlgrey.u_spi_host0.u_cmd_cdc.u_sync_reqack.u_prim_sync_reqack.dst_req_o"
    evidence: spi_host_command_cdc.sv:69-84, prim_sync_reqack.sv
  - source: top_earlgrey.u_spi_host0.u_cmd_cdc.u_sync_reqack.src_req_i
    dest: top_earlgrey.u_spi_host0.u_cmd_cdc.u_sync_reqack.dst_req_o
    assertion_suffix: _data_hold_src2dst
    contains:
      - "!$stable(top_earlgrey.u_spi_host0.u_cmd_cdc.u_sync_reqack.data_i)"
      - "@(posedge top_earlgrey.u_spi_host0.u_cmd_cdc.u_sync_reqack.clk_src_i)"
    evidence: spi_host_command_cdc.sv:69-84, prim_sync_reqack_data.sv:89-94

