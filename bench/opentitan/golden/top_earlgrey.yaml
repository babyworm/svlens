reset_unresolved_references:
  - signal: top_earlgrey.u_hmac.rst_ni
    dest_domain: clkmgr_aon_clocks.clk_main_hmac
    conditional_mux:
      output: top_earlgrey.u_rstmgr_aon.u_0_sys_mux.clk_o
      input0: top_earlgrey.u_rstmgr_aon.u_0_sys_mux.clk0_i
      input1: top_earlgrey.u_rstmgr_aon.u_0_sys_mux.clk1_i
      select: top_earlgrey.u_rstmgr_aon.u_0_sys_mux.sel_i
      input0_source: top_earlgrey.u_rstmgr_aon.rst_sys_n[1]
      input1_source: top_earlgrey.u_rstmgr_aon.scan_rst_ni
      select_dependencies:
        - top_earlgrey.u_rstmgr_aon.leaf_rst_scanmode[7]
      input0_candidate_ffs:
        - path: top_earlgrey.u_rstmgr_aon.u_0_sys.u_sync_2.q_o
          domain: clk_main_i
          inverted: false
    conditional_mux_absent_fields: [select_source, selected_input, input1_candidate_ffs]
    conditional_mux_count: 1
    evidence: >-
      top_earlgrey.sv:2166-2168 connects rst_sys_n[Domain0Sel] to HMAC;
      rstmgr.sv:390-414 selects prim_flop_2sync output or scan_rst_ni
      through prim_clock_mux2. No unique unconditional FF driver is proven.

