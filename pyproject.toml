[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "svlens"
version = "0.4.0"
description = "Python API for the svlens SystemVerilog analyzer"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["svlens*"]
